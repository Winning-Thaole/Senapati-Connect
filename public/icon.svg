<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.1" />
    </filter>
  </defs>

  <circle cx="256" cy="256" r="250" fill="#ffffff" filter="url(#shadow)" />
  <circle cx="256" cy="256" r="240" fill="none" stroke="#e2e8f0" stroke-width="8" />
  <circle cx="256" cy="256" r="226" fill="none" stroke="#a7f3d0" stroke-width="3" />
  
  <clipPath id="innerArea">
    <circle cx="256" cy="256" r="236" />
  </clipPath>

  <g clip-path="url(#innerArea)">
    <rect x="0" y="0" width="512" height="256" fill="#f8fafc" />
    
    <path d="M20 240 L256 80 L492 240 Z" fill="#0f766e" />
    <path d="M-10 260 Q 120 120 256 180 T 522 260 L 522 280 L -10 280 Z" fill="#10b981" />
    <path d="M-20 280 Q 150 200 280 240 T 532 240 L 532 300 L -20 300 Z" fill="#34d399" />
    
    <path d="M256 280 C 200 250, 220 230, 270 210 C 290 200, 310 190, 290 170 C 270 150, 260 140, 256 130" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />
    
    <!-- Left Icon (Store) -->
    <circle cx="160" cy="190" r="18" fill="#ffffff" stroke="#064e3b" stroke-width="2" />
    <rect x="151" y="186" width="18" height="12" fill="#064e3b" />
    <polygon points="148,186 172,186 160,176" fill="#064e3b" />
    <rect x="156" y="190" width="8" height="8" fill="#ffffff" />

    <!-- Middle Icon (Stall) -->
    <circle cx="266" cy="150" r="20" fill="#ffffff" stroke="#064e3b" stroke-width="2" />
    <rect x="254" y="145" width="24" height="15" fill="none" stroke="#064e3b" stroke-width="2" />
    <polygon points="252,145 280,145 266,134" fill="#064e3b" />
    <rect x="258" y="145" width="16" height="5" fill="#064e3b" />

    <!-- Right Icon (Gear) -->
    <circle cx="360" cy="180" r="18" fill="#ffffff" stroke="#064e3b" stroke-width="2" />
    <circle cx="360" cy="180" r="7" fill="none" stroke="#064e3b" stroke-width="5" stroke-dasharray="5 3" />
    <circle cx="360" cy="180" r="3" fill="#ffffff" />

    <path d="M-10 260 Q 128 230 256 260 T 522 260 L 522 290 L -10 290 Z" fill="#ffffff" />
    
    <path d="M-10 380 Q 256 340 522 390 L 522 522 L -10 522 Z" fill="#064e3b" />
    <path d="M-10 380 Q 256 340 522 390" fill="none" stroke="#10b981" stroke-width="4" />
  </g>

  <text x="256" y="295" font-family="'Georgia', 'Times New Roman', serif" font-weight="900" font-size="52" fill="#064e3b" text-anchor="middle" letter-spacing="2">SENAPATI</text>
  
  <text x="256" y="345" font-family="'Georgia', 'Times New Roman', serif" font-weight="800" font-size="46" fill="#064e3b" text-anchor="middle" letter-spacing="2">CONNECT</text>
  
  <text x="256" y="365" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="12" fill="#d1fae5" text-anchor="middle" letter-spacing="1">ONLINE BUSINESS DIRECTORY</text>
  <text x="256" y="380" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="12" fill="#d1fae5" text-anchor="middle" letter-spacing="1">| SENAPATI DISTRICT</text>
</svg>
